name: WaterPipe Android Build

on:
  push:
    branches:
      - waterpipe-android
    paths:
      - 'WaterPipe-Android/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - waterpipe-android
    paths:
      - 'WaterPipe-Android/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  PROJECT_DIR: WaterPipe-Android
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'
  GRADLE_VERSION: '8.7'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK (Debug + Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NOTE: Do NOT use defaults.run.working-directory here.
    # Several actions (e.g. upload-artifact, setup-gradle) interpret paths relative
    # to the repository root; a blanket working-directory would double-prefix them
    # (e.g. WaterPipe-Android/WaterPipe-Android/...). We cd explicitly in each shell step.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 1) Wrapper check + generate if missing -----------------------------
      - name: Validate Gradle wrapper files
        id: wrapper_check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          WRAPPER_DIR="gradle/wrapper"
          PROPS="${WRAPPER_DIR}/gradle-wrapper.properties"
          JAR="${WRAPPER_DIR}/gradle-wrapper.jar"
          MISSING=0
          if [ ! -f "gradlew" ]; then MISSING=1; echo "::notice::Missing gradlew script (will be (re)generated)"; fi
          if [ ! -f "${PROPS}" ]; then MISSING=1; echo "::notice::Missing ${PROPS} (will be (re)generated)"; fi
          if [ ! -f "${JAR}" ]; then MISSING=1; echo "::notice::gradle-wrapper.jar not committed (will be (re)generated)"; fi
          if [ "${MISSING}" = "1" ]; then
            echo "need_generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_generate=false" >> "$GITHUB_OUTPUT"
          fi
          # Always ensure gradlew is executable in the checkout
          [ -f "gradlew" ] && chmod +x gradlew || true
          if [ -f "gradlew" ]; then echo "gradlew permission: $(stat -c '%a' gradlew)"; fi

      - name: Set up JDK ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}

      # Install a matching Gradle distribution once (before setup-gradle cache use)
      # so we can run `gradle wrapper` to regenerate the complete wrapper trio
      # (gradlew + gradlew.bat + gradle/wrapper/gradle-wrapper.jar + properties).
      - name: Setup Gradle (distribution)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-write-only: false
          cache-read-only: false

      - name: Generate Gradle wrapper (if missing)
        id: gen_wrapper
        if: steps.wrapper_check.outputs.need_generate == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          # Back up the existing properties file if present (it may already contain a
          # valid distributionUrl that we want to preserve for URL consistency).
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cp "gradle/wrapper/gradle-wrapper.properties" /tmp/gwp.backup
            echo "Backed up existing gradle-wrapper.properties"
          fi
          # Note: Gradle < 8.x does NOT support a --distribution-url CLI flag. Use only
          # the officially supported flags; then patch the properties file afterwards
          # if we had a preferred distributionUrl on file.
          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin
          chmod +x gradlew
          # If we had a prior properties file with an explicit distributionUrl,
          # re-apply it so the generated wrapper points at the exact same binary.
          if [ -f /tmp/gwp.backup ]; then
            EXISTING_URL=$(grep -E '^distributionUrl=' /tmp/gwp.backup || true)
            if [ -n "${EXISTING_URL}" ]; then
              # Replace the distributionUrl line in the newly generated file.
              if grep -qE '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties; then
                sed -i "s|^distributionUrl=.*|${EXISTING_URL}|" gradle/wrapper/gradle-wrapper.properties
              else
                echo "${EXISTING_URL}" >> gradle/wrapper/gradle-wrapper.properties
              fi
              echo "Re-applied saved distributionUrl from backup properties"
            fi
            rm -f /tmp/gwp.backup
          fi
          # Sanity checks
          ls -la gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! file gradle/wrapper/gradle-wrapper.jar | grep -qiE '(zip|jar)'; then
            echo "::error::Generated gradle-wrapper.jar is not a valid jar"
            exit 1
          fi
          echo "Gradle wrapper generated successfully."

      # After any generation/validation, re-run setup-gradle in "wrapper" mode to let
      # gradle/actions manage its cache around the actual wrapper execution.
      # Note: setup-gradle@v4 does not accept a build-root-directory input; we rely on
      # each shell step using working-directory so the wrapper at $PROJECT_DIR/gradlew
      # is discovered on PATH.
      - name: Setup Gradle (wrapper mode)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-write-only: ${{ github.ref == 'refs/heads/waterpipe-android' }}
          cache-read-only: false
          validate-wrappers: false

      # ---- 2) Build -----------------------------------------------------------
      - name: Build debug APK
        id: build_debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace --warning-mode all \
            :app:assembleDebug \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Build release APK (unsigned)
        id: build_release
        if: always() && steps.build_debug.outcome == 'success'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace --warning-mode all \
            :app:assembleRelease \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      # ---- 3) Locate artifacts (repo-root relative paths for upload-artifact) -
      - name: Locate APK artifacts
        id: locate
        if: always()
        run: |
          set -e
          REL_APP_OUT="${PROJECT_DIR}/app/build/outputs/apk"
          echo "::group::APK output tree"
          if [ -d "${REL_APP_OUT}" ]; then
            find "${REL_APP_OUT}" -type f \( -name '*.apk' -o -name 'output-metadata.json' \) -print0 | xargs -0 ls -la || echo "No APKs found"
          else
            echo "Directory ${REL_APP_OUT} does not exist yet"
          fi
          echo "::endgroup::"

          DEBUG_APK=""
          if [ -d "${REL_APP_OUT}/debug" ]; then
            DEBUG_APK=$(find "${REL_APP_OUT}/debug" -maxdepth 2 -name '*.apk' -type f | head -n1 || true)
          fi
          RELEASE_APK=""
          if [ -d "${REL_APP_OUT}/release" ]; then
            # Prefer signed if any; otherwise unsigned
            RELEASE_APK=$( (find "${REL_APP_OUT}/release" -maxdepth 2 -name 'app-release.apk' -type f;
                            find "${REL_APP_OUT}/release" -maxdepth 2 -name '*.apk' ! -name '*-unsigned.apk' -type f;
                            find "${REL_APP_OUT}/release" -maxdepth 2 -name '*-unsigned.apk' -type f) | head -n1 || true)
          fi

          if [ -z "${DEBUG_APK}" ]; then
            echo "::warning::Debug APK not found"
          else
            echo "debug_apk=${DEBUG_APK}" >> "$GITHUB_OUTPUT"
            echo "debug_name=$(basename "${DEBUG_APK}")" >> "$GITHUB_OUTPUT"
            echo "Debug APK (repo-root-relative): ${DEBUG_APK}"
          fi

          if [ -z "${RELEASE_APK}" ]; then
            echo "::warning::Release APK not found"
          else
            echo "release_apk=${RELEASE_APK}" >> "$GITHUB_OUTPUT"
            echo "release_name=$(basename "${RELEASE_APK}")" >> "$GITHUB_OUTPUT"
            echo "Release APK (repo-root-relative): ${RELEASE_APK}"
          fi

      - name: Upload debug APK artifact
        if: steps.locate.outputs.debug_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: waterpipe-android-debug-apk
          path: ${{ steps.locate.outputs.debug_apk }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK artifact
        if: steps.locate.outputs.release_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: waterpipe-android-release-apk
          path: ${{ steps.locate.outputs.release_apk }}
          if-no-files-found: warn
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waterpipe-android-build-logs
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
            ${{ env.PROJECT_DIR }}/**/build/reports/**
            ~/.gradle/daemon/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "### WaterPipe Android Build Summary 🚰" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch / SHA: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- JDK: Java ${{ env.JAVA_VERSION }} (${{ env.JAVA_DIST }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle wrapper version: ${{ env.GRADLE_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug APK: \`${{ steps.locate.outputs.debug_name || '(not found)' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release APK: \`${{ steps.locate.outputs.release_name || '(not found)' }}\`" >> "$GITHUB_STEP_SUMMARY"
